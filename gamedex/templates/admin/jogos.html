{% extends 'base.html' %}
{% block titulo %} Jogos {% endblock %}
{% block content %}

  <div class="table-responsive">
    <table class="table table-striped table-hover bg-white shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>Nome</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for j in jogos %}
          <tr>
            <td>{{ j.nome }}</td>
          </tr>
            <td>
              <a href="{{ url_for('games.status', id=j.id, response='aprovado') }}" class="btn btn-warning">Aprovar</a>
            </td>
            <td>
              <a href="{{ url_for('games.status', id=j.id, response='rejeitado') }}" class="btn btn-warning">Rejeitar</a>
            </td>
        {% else %}
          <tr>
            <td colspan="1" class="text-center">Nenhum jogo pendente.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
